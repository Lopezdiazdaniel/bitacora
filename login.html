<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bitácora Operativa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --azul-claro-1: #b5d5e8;
            --azul-claro-2: #8ac4f0;
            --azul-medio: #5ab1ef;
            --azul-profundo: #3182ce;
            --azul-oscuro: #1b4f91;
        }

        body, html {
            height: 100%;
            margin: 0;
        }

        .login-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--azul-claro-1), var(--azul-medio));
        }

        /* Olas / río animadas de fondo */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeat-x;
        }

        .wave.wave1 {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" fill="%233182ce"/></svg>');
            animation: animateWave 18s linear infinite;
            z-index: 1;
            opacity: 0.3;
        }

        .wave.wave2 {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,30 C200,100 400,0 600,50 C800,100 1000,10 1200,40 L1200,120 L0,120 Z" fill="%231b4f91"/></svg>');
            animation: animateWaveInverse 12s linear infinite;
            z-index: 2;
            opacity: 0.4;
        }

        .wave.wave3 {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,60 C150,20 400,90 600,30 C800,-20 1050,80 1200,50 L1200,120 L0,120 Z" fill="%238ac4f0"/></svg>');
            animation: animateWave 8s linear infinite;
            z-index: 3;
            opacity: 0.5;
        }

        @keyframes animateWave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes animateWaveInverse {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* Tarjeta flotante con 25% de transparencia (75% opaca) y efecto blur */
        .login-card-custom {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(27, 79, 145, 0.25);
            max-width: 480px;
            width: 90%;
            padding: 40px;
        }

        .form-control-custom {
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid #b5d5e8;
            border-radius: 12px;
            padding: 12px 15px;
        }

        .form-control-custom:focus {
            background-color: #fff;
            border-color: var(--azul-profundo);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.25);
        }

        .btn-custom-login {
            background-color: var(--azul-oscuro);
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-custom-login:hover {
            background-color: var(--azul-profundo);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(27, 79, 145, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="wave-container">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
        </div>

        <div class="login-card-custom">
            <div class="text-center mb-4">
                <div class="text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 65px; height: 65px; background: linear-gradient(135deg, var(--azul-profundo), var(--azul-oscuro));">
                    <i class="bi bi-water fs-2"></i>
                </div>
                <h3 class="fw-bold" style="color: var(--azul-oscuro);">Bitácora Operativa</h3>
                <p class="text-muted small">Prueba: <strong>ADMIN</strong> o <strong>GUARDIA1</strong> / Pass: <strong>123</strong></p>
            </div>

            <!-- Formulario conectado a la lógica de validación con datos_prueba.json -->
            <form id="login-form" onsubmit="intentarLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold small" style="color: var(--azul-oscuro);">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white bg-opacity-50 border-end-0 rounded-start-3"><i class="bi bi-person text-primary"></i></span>
                        <input type="text" class="form-control form-control-custom border-start-0 rounded-end-3 text-uppercase" id="input-usuario" placeholder="Ej. ADMIN" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: var(--azul-oscuro);">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white bg-opacity-50 border-end-0 rounded-start-3"><i class="bi bi-key text-primary"></i></span>
                        <input type="password" class="form-control form-control-custom border-start-0 rounded-end-3" id="input-password" placeholder="********" required>
                    </div>
                </div>
                <div id="login-error" class="alert alert-danger py-2 small d-none mb-3 text-center">
                    Usuario o contraseña incorrectos.
                </div>
                <button type="submit" class="btn btn-custom-login w-100 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function intentarLogin(event) {
            event.preventDefault();
            const usuarioInput = document.getElementById('input-usuario').value.trim().toUpperCase();
            const passwordInput = document.getElementById('input-password').value.trim();
            const errorDiv = document.getElementById('login-error');

            try {
                // Cargar los usuarios desde el archivo JSON de prueba
                const respuesta = await fetch('datos_prueba.json');
                const data = await respuesta.json();

                const usuarioEncontrado = data.usuarios.find(
                    u => u.usuario === usuarioInput && u.password === passwordInput
                );

                if (usuarioEncontrado) {
                    errorDiv.classList.add('d-none');
                    // Guardar en sessionStorage el guardia activo para usarlo en la bitácora
                    sessionStorage.setItem('guardia_activo', usuarioEncontrado.nombre_completo);
                    // Redirigir a la bitácora
                    window.location.href = 'bitacora.html';
                } else {
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                console.error("Error al conectar con datos_prueba.json:", error);
                alert("Asegúrate de abrir el proyecto usando Live Server en VS Code para permitir la lectura del JSON.");
            }
        }
    </script>
</body>
</html>
